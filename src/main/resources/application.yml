spring:
  application:
    name: ai-code-review-assistant

  datasource:
    url: jdbc:postgresql://ep-round-block-aoyghtd9-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
    username: neondb_owner
    password: ${CRA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  upload-dir: ./uploads
  reports-dir: ./reports

groq:
  api:
    key: ${GROQ_API_KEY}
    model: llama-3.3-70b-versatile

spotbugs:
  home: ${SPOTBUGS_HOME:D:\tools\spotbugs-4.8.6}